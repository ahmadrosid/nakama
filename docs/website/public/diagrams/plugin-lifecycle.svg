<svg
  aria-labelledby="title desc"
  height="540"
  role="img"
  viewBox="0 0 680 540"
  width="680"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="title">How a plugin reaches your team</title>
  <desc id="desc">
    A plugin comes from npm, the official catalog, or a Super Nakama draft. A
    platform admin reviews and installs it. An org admin enables it. A platform
    admin connects it to profiles. Members then use its page and chat tools.
  </desc>
  <style>
  .bg {
    fill: #ffffff;
    stroke: #e7e5e4;
  }
  .src {
    fill: #f5f5f4;
    stroke: #a8a29e;
  }
  .gate {
    fill: #fef3c7;
    stroke: #d97706;
  }
  .use {
    fill: #e1f5ee;
    stroke: #0f6e56;
  }
  .title {
    font:
      500 14px ui-sans-serif,
      system-ui,
      sans-serif;
    fill: #1c1917;
  }
  .sub {
    font:
      400 12px ui-sans-serif,
      system-ui,
      sans-serif;
    fill: #57534e;
  }
  .gate-t {
    fill: #78350f;
  }
  .gate-s {
    fill: #92400e;
  }
  .use-t {
    fill: #085041;
  }
  .use-s {
    fill: #0f6e56;
  }
  .arr {
    fill: none;
    stroke: #78716c;
    stroke-width: 1.2;
  }
  @media (prefers-color-scheme: dark) {
    .bg {
      fill: #111113;
      stroke: #27272a;
    }
    .src {
      fill: #1c1917;
      stroke: #57534e;
    }
    .gate {
      fill: #451a03;
      stroke: #f59e0b;
    }
    .use {
      fill: #04342c;
      stroke: #5dcaa5;
    }
    .title {
      fill: #f5f5f4;
    }
    .sub {
      fill: #a8a29e;
    }
    .gate-t {
      fill: #fef3c7;
    }
    .gate-s {
      fill: #fcd34d;
    }
    .use-t {
      fill: #e1f5ee;
    }
    .use-s {
      fill: #9fe1cb;
    }
    .arr {
      stroke: #a8a29e;
    }
  }
  </style>
  <defs>
    <marker
      id="a"
      markerHeight="6"
      markerWidth="6"
      orient="auto-start-reverse"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path
        class="arr"
        d="M2 1L8 5L2 9"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
      />
    </marker>
  </defs>
  <rect class="bg" height="539" rx="12" width="679" x="0.5" y="0.5" />

  <rect class="src" height="56" rx="8" width="180" x="40" y="32" />
  <text class="title" text-anchor="middle" x="130" y="55">npm package</text>
  <text class="sub" text-anchor="middle" x="130" y="74">
    Name and exact version
  </text>

  <rect class="src" height="56" rx="8" width="180" x="250" y="32" />
  <text class="title" text-anchor="middle" x="340" y="55">Official plugin</text>
  <text class="sub" text-anchor="middle" x="340" y="74">Ships with Nakama</text>

  <rect class="src" height="56" rx="8" width="180" x="460" y="32" />
  <text class="title" text-anchor="middle" x="550" y="55">
    Super Nakama draft
  </text>
  <text class="sub" text-anchor="middle" x="550" y="74">Built in chat</text>

  <path class="arr" d="M130 88 L265 138" marker-end="url(#a)" />
  <path class="arr" d="M340 88 L340 138" marker-end="url(#a)" />
  <path class="arr" d="M550 88 L415 138" marker-end="url(#a)" />

  <rect class="gate" height="56" rx="8" width="300" x="190" y="142" />
  <text class="title gate-t" text-anchor="middle" x="340" y="165">
    1. Review and install
  </text>
  <text class="sub gate-s" text-anchor="middle" x="340" y="184">
    Platform admin · no code runs
  </text>
  <path class="arr" d="M340 198 L340 228" marker-end="url(#a)" />

  <rect class="gate" height="56" rx="8" width="300" x="190" y="232" />
  <text class="title gate-t" text-anchor="middle" x="340" y="255">
    2. Enable for the organization
  </text>
  <text class="sub gate-s" text-anchor="middle" x="340" y="274">
    Org admin · creates its data store
  </text>
  <path class="arr" d="M340 288 L340 318" marker-end="url(#a)" />

  <rect class="gate" height="56" rx="8" width="300" x="190" y="322" />
  <text class="title gate-t" text-anchor="middle" x="340" y="345">
    3. Connect to profiles
  </text>
  <text class="sub gate-s" text-anchor="middle" x="340" y="364">
    Platform admin · picks its tools
  </text>
  <path class="arr" d="M340 378 L250 418" marker-end="url(#a)" />
  <path class="arr" d="M340 378 L430 418" marker-end="url(#a)" />

  <rect class="use" height="56" rx="8" width="230" x="90" y="422" />
  <text class="title use-t" text-anchor="middle" x="205" y="445">
    Plugin page
  </text>
  <text class="sub use-s" text-anchor="middle" x="205" y="464">
    Members open it
  </text>

  <rect class="use" height="56" rx="8" width="230" x="360" y="422" />
  <text class="title use-t" text-anchor="middle" x="475" y="445">
    Tools in chat
  </text>
  <text class="sub use-s" text-anchor="middle" x="475" y="464">
    Assigned profiles call them
  </text>

  <text class="sub" text-anchor="middle" x="340" y="512">
    Both read and write the same organization data
  </text>
</svg>
