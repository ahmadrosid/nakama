# Temporary: finds what makes Windows tests slow. Not for merge.
name: Windows profile
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  profile:
    name: win-profile (${{ matrix.disk }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        disk: [default, devdrive]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Dev Drive
        if: matrix.disk == 'devdrive'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 8GB
          workspace-copy: true
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp
            BUN_INSTALL_CACHE_DIR,{{ DEV_DRIVE }}/bun-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Disk info
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free, Root
          "TEMP=$env:TEMP RUNNER_TEMP=$env:RUNNER_TEMP WORKSPACE=$env:GITHUB_WORKSPACE DEV_DRIVE=$env:DEV_DRIVE DEV_DRIVE_WORKSPACE=$env:DEV_DRIVE_WORKSPACE"
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
      - name: Bench
        shell: bash
        run: |
          dirs=("$TEMP/bench" "$RUNNER_TEMP/bench")
          [[ -n "$DEV_DRIVE" ]] && dirs+=("$DEV_DRIVE/bench")
          bun .github/win-profile/bench.ts "${dirs[@]}" || echo "bench exited $?"
      - name: Install
        shell: bash
        run: |
          cd "${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}"
          start=$(date +%s)
          bun install --frozen-lockfile --ignore-scripts --filter nakama --filter '@nakama/server...' --filter './packages/*' --filter './packages/plugins/*' > /dev/null
          echo "install took $(( $(date +%s) - start ))s"
      - name: Slow files alone
        shell: bash
        run: |
          cd "${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}"
          for f in apps/server/src/services/python-tool-loader.test.ts apps/server/src/services/profile-service.test.ts \
            packages/core/src/tools/knowledge-base-search.test.ts apps/server/src/http/app.test.ts \
            apps/server/src/services/agent-group-store.test.ts apps/server/src/services/plugin-service.test.ts \
            apps/server/src/services/agent-group-service.test.ts; do
            start=$(date +%s)
            bun test "$f" --timeout=60000 2>&1 | grep -E "\[[0-9]{4,}\.[0-9]+ms\]|^ *[0-9]+ (pass|fail)" || true
            echo "== $f took $(( $(date +%s) - start ))s"
          done
      - name: Slow files with 4 workers
        shell: bash
        run: |
          cd "${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}"
          start=$(date +%s)
          bun test apps/server/src/services/python-tool-loader.test.ts apps/server/src/services/profile-service.test.ts \
            packages/core/src/tools/knowledge-base-search.test.ts apps/server/src/http/app.test.ts \
            apps/server/src/services/agent-group-store.test.ts apps/server/src/services/plugin-service.test.ts \
            apps/server/src/services/agent-group-service.test.ts --parallel=4 --timeout=60000 2>&1 \
            | grep -E "\[[0-9]{4,}\.[0-9]+ms\]|^ *[0-9]+ (pass|fail)" || true
          echo "took $(( $(date +%s) - start ))s"
      - name: Server shard 1/4 with 4 workers
        shell: bash
        run: |
          cd "${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}"
          start=$(date +%s)
          bun test apps/server --shard=1/4 --parallel=4 --timeout=60000 2>&1 | grep -E "^ *[0-9]+ (pass|fail)|\[[0-9]{4,}\.[0-9]+ms\]" | sort -t[ -k2 -rn | head -30 || true
          echo "took $(( $(date +%s) - start ))s"
