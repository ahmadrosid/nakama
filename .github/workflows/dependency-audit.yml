name: Dependency audit

# The image installs `.docker/runtime-deps/bun.lock` and the docs site has its
# own lockfile, so `bun audit` at the root misses shipped bytes and docs bytes.
on:
  # A PR that touches no dependency manifest cannot change the audit result.
  # Main pushes and the weekly run always audit, so drift is still caught.
  pull_request:
    paths:
      - bun.lock
      - package.json
      - docs/website/bun.lock
      - docs/website/package.json
      - .docker/*/bun.lock
      - .docker/*/package.json
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push to a PR makes the old run's result useless, so stop it. Main
# keeps every run: each push there is a commit someone may need a result for.
concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # GHSA-fc5q-39xc-vjpf: picomatch ReDoS, every version up to 4.0.7 and no
      # patched release yet. Our globs are hardcoded, not user input.
      # Drop this once picomatch ships a fix.
      AUDIT_IGNORE: --ignore=GHSA-fc5q-39xc-vjpf
    steps:
      # Budget: the job fails if its steps take longer, so a slowdown shows up
      # on the PR that causes it. Set from the slowest green run since the
      # shards landed (about 1.3x), and lowered as CI gets faster.
      - name: Start the time budget
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Audit root lockfile
        run: bun audit --production --audit-level=high $AUDIT_IGNORE

      - name: Audit shipped image lockfile
        working-directory: .docker/runtime-deps
        run: bun audit --audit-level=high $AUDIT_IGNORE

      - name: Audit docs website lockfile
        working-directory: docs/website
        run: bun audit --audit-level=high $AUDIT_IGNORE

      - name: Check the time budget
        shell: bash
        env:
          BUDGET: 20
        run: |
          took=$(( $(date +%s) - JOB_START ))
          echo "Took ${took}s of a ${BUDGET}s budget."
          (( took <= BUDGET )) || { echo "::error::Over the time budget: ${took}s > ${BUDGET}s. Find what got slower."; exit 1; }
