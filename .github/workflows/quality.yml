name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  duplication:
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Fails when duplication passes the threshold in .jscpd.json (3%).
      - name: Detect copy-paste
        run: bun run dupes

      - name: Publish report
        if: always()
        run: cat .jscpd-report/jscpd-report.md >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    # A report, not a gate. Unit Tests is what blocks a merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=text | tee coverage.txt

      - name: Publish summary
        if: always()
        run: |
          table() {
            awk '/^File .*% Funcs/{p=1} /^ *[0-9]+ (pass|fail)/{p=0} p' coverage.txt
          }
          {
            echo '## Coverage'
            echo '```'
            table | head -3
            echo '```'
            echo '<details><summary>Per-file</summary>'
            echo
            echo '```'
            table
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  test-mass:
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    # A report, not a gate. Between v0.2.0 and v0.4.32 test code grew 211% while
    # source grew 82%, so test mass is where this repo actually bloats, and a
    # "files changed" count hides it.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Report test to source ratio
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three dots: count what this branch added, not what main moved on by.
          counts=$(git diff --numstat "$BASE...$HEAD" -- '*.ts' '*.tsx' \
            | awk -F'\t' '
                $1 == "-" { next }
                $3 ~ /\.(test|spec)\.[a-z]+$/ { t += $1 - $2; next }
                { s += $1 - $2 }
                END { printf "%d %d", s + 0, t + 0 }')
          src=${counts% *}
          test=${counts#* }
          ratio=$(awk -v s="$src" -v t="$test" 'BEGIN { if (s > 0) printf "%.2f", t / s; else printf "n/a" }')
          line="$src source lines, $test test lines, ratio $ratio"
          echo "$line"
          {
            echo '## Test mass'
            echo
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ratio" != "n/a" ] && awk -v r="$ratio" 'BEGIN { exit !(r > 2) }'; then
            note='More than twice as much test code as source. Check the new cases against the list AGENTS.md keeps of tests the maintainer deletes.'
            echo "::notice::$note"
            printf '\n%s\n' "$note" >> "$GITHUB_STEP_SUMMARY"
          fi

  new-workspace:
    runs-on: ubuntu-latest
    # AGENTS.md already asks for code to live in an existing package. packages/ui
    # landed anyway, 172 lines and no tests, so the rule needs something that runs.
    # The label is the escape hatch for a package that is genuinely the right call.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'new-package') }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Refuse an unlabelled new workspace
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Any new manifest under these trees is a new workspace: the root
          # package.json globs are apps/*, apps/platform/*, packages/* and
          # packages/plugins/*, and no fixture carries its own package.json.
          added=$(git diff --name-only --diff-filter=A "$BASE...$HEAD" \
            -- 'packages/**/package.json' 'apps/**/package.json')
          if [ -z "$added" ]; then
            echo 'No new workspace.'
            exit 0
          fi
          for f in $added; do
            echo "::error file=$f::new workspace added here"
          done
          cat >&2 <<'MSG'
          This PR adds a workspace. Put the code in an existing package unless one
          genuinely cannot hold it, which is what AGENTS.md asks for.
          If the package is the right call, add the new-package label to this PR.
          MSG
          exit 1
