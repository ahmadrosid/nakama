name: Quality

on:
  pull_request:
    # Markdown-only PRs change no code.
    paths-ignore: ['**.md', '.agents/**', 'docs/**', 'scripts/**', 'assets/**']

permissions:
  contents: read

jobs:
  duplication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Fails when duplication passes the threshold in .jscpd.json (3%).
      - name: Detect copy-paste
        run: bun run dupes

      - name: Publish report
        if: always()
        run: cat .jscpd-report/jscpd-report.md >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    # A report, not a gate. Unit Tests is what blocks a merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up Electron
        run: |
          bun apps/desktop/node_modules/electron/install.js
          sudo chown root:root apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 apps/desktop/node_modules/electron/dist/chrome-sandbox

      - name: Run tests with coverage
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          status=0
          # Match the root workspace globs, but keep each workspace's config and report.
          for workspace in apps/* apps/platform/* packages/* packages/plugins/*; do
            [ -f "$workspace/package.json" ] || continue
            bun -e 'process.exit(require("./" + process.argv[1]).scripts?.test ? 0 : 1)' "$workspace/package.json" || continue
            report="coverage/${workspace//\//-}"
            workspace_status=0
            if [ "$workspace" = apps/desktop ]; then
              # The compound script must pass coverage flags to Bun, not Electron.
              xvfb-run -a bun run --cwd "$workspace" test:coverage 2>&1 | tee "$report.txt" || workspace_status=$?
            else
              bun run --cwd "$workspace" test --coverage --coverage-reporter=text 2>&1 | tee "$report.txt" || workspace_status=$?
            fi
            echo "$workspace_status" > "$report.status"
            if [ "$workspace_status" -ne 0 ]; then status=1; fi
          done
          exit "$status"

      - name: Publish summary
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          shopt -s nullglob
          reports=(coverage/*.txt)
          {
            echo '## Coverage'
            echo "Test step: **$TEST_OUTCOME** (advisory; Unit Tests is the merge gate)."
            echo 'Reports are per workspace, not averaged. Electron smoke tests run without Bun coverage.'
            if [ "${#reports[@]}" -eq 0 ]; then
              echo 'No coverage reports produced. Check the setup and test logs.'
            fi
            for report in "${reports[@]}"; do
              echo
              echo "### ${report#coverage/}"
              echo "Exit status: $(cat "${report%.txt}.status" 2>/dev/null || echo unknown)"
              if grep -q '^All files' "$report"; then
                echo '```text'
                awk '/^File .*% Funcs/ || /^All files/' "$report"
                echo '```'
                echo '<details><summary>Per-file coverage</summary>'
                echo
                echo '```text'
                awk '/^File .*% Funcs/{p=1} p && /^$/{p=0} p' "$report"
                echo '```'
                echo '</details>'
              else
                echo 'No coverage table produced. Check the test logs.'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  test-mass:
    runs-on: ubuntu-latest
    # A report, not a gate. Between v0.2.0 and v0.4.32 test code grew 211% while
    # source grew 82%, so test mass is where this repo actually bloats, and a
    # "files changed" count hides it.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Report test to source ratio
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three dots: count what this branch added, not what main moved on by.
          counts=$(git diff --numstat "$BASE...$HEAD" -- '*.ts' '*.tsx' \
            | awk -F'\t' '
                $1 == "-" { next }
                $3 ~ /\.(test|spec)\.[a-z]+$/ { t += $1 - $2; next }
                { s += $1 - $2 }
                END { printf "%d %d", s + 0, t + 0 }')
          src=${counts% *}
          test=${counts#* }
          ratio=$(awk -v s="$src" -v t="$test" 'BEGIN { if (s > 0) printf "%.2f", t / s; else printf "n/a" }')
          line="$src source lines, $test test lines, ratio $ratio"
          echo "$line"
          {
            echo '## Test mass'
            echo
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ratio" != "n/a" ] && awk -v r="$ratio" 'BEGIN { exit !(r > 2) }'; then
            note='More than twice as much test code as source. Check the new cases against the list AGENTS.md keeps of tests the maintainer deletes.'
            echo "::notice::$note"
            printf '\n%s\n' "$note" >> "$GITHUB_STEP_SUMMARY"
          fi
