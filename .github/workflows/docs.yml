name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/website/**', '.github/workflows/docs.yml']
  # A tagged image is published: republish version.txt for the update check.
  workflow_run:
    workflows: [Docker Publish]
    types: [completed]
  # Build only. A broken page should fail here, not after the merge.
  pull_request:
    paths: ['docs/website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

# Default to read-only. Only the deploy job holds the Pages OIDC token, so the
# install and build never run with publication credentials.
permissions:
  contents: read

# A pull request gets its own group so it can never cancel a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    # Docker Publish also runs on main. Only a successful v* tag run counts.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Running servers offer an update to this version, so it must be a tag
      # whose Docker images are already published.
      - name: Find the newest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: ${{ github.event_name != 'pull_request' }}
        run: |
          version=""
          for tag in $(git ls-remote --tags --refs origin 'v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -Vr | head -n 5); do
            published="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker-publish.yml/runs?branch=$tag&status=success&per_page=1" --jq .total_count)"
            if [ "$published" -gt 0 ]; then
              version="${tag#v}"
              break
            fi
          done
          if [ -z "$version" ] && [ "$REQUIRED" = "true" ]; then
            echo "No v* tag with a successful Docker Publish run." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: docs/website

      - name: Check docs pipeline
        run: bun run check:pipeline
        working-directory: docs/website

      - name: Build docs
        run: bun run build
        working-directory: docs/website
        env:
          NODE_ENV: production
          NAKAMA_DOCS_GITHUB_PAGES: 'true'
          NAKAMA_LATEST_VERSION: ${{ steps.release.outputs.version }}

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/website/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Retry Pages deploy
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify Pages deploy
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
