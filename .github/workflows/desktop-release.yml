name: Desktop Release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Desktop tag to build (blank for selected ref; Store requires an existing release). Artifact only.'
        required: false
        type: string
      windows_target:
        description: 'Windows artifact to build; manual runs never publish'
        type: choice
        default: store
        options: [store, installer]

# Default to read-only. Jobs that publish declare contents: write themselves, so
# an install or build step never runs with a release-capable token.
permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    environment: code-signing
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Validate version and signing credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test "$(uname -m)" = arm64
          bun -e 'const v = (await Bun.file("apps/desktop/package.json").json()).version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.RELEASE_TAG !== `desktop-v${v}`) throw new Error("Tag must match the stable desktop package version")'
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!key}" || { echo "Missing release secret: $key"; exit 1; }
          done

      # Signing secrets live in the job environment, so no lifecycle script may
      # run during install. Electron's own install step runs explicitly, and
      # Unit Tests does the same.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun apps/desktop/node_modules/electron/install.js

      - name: Build runtime and run smoke tests
        run: |
          bun run --cwd apps/desktop test
          bun run --cwd apps/desktop build:runtime
          bun run --cwd apps/desktop test:runtime

      - name: Sign, notarize, and package
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ulimit -n 65536
          bun x electron-builder --mac --arm64 --publish never -c.forceCodeSigning=true

      - name: Verify packaged app
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' apps/desktop/dist/electron/mac-arm64/Nakama.app/Contents/Info.plist)" = '15.0'
          ELECTRON_RUN_AS_NODE=1 apps/desktop/dist/electron/mac-arm64/Nakama.app/Contents/MacOS/Nakama --version
          codesign --verify --deep --strict apps/desktop/dist/electron/mac-arm64/Nakama.app
          xcrun stapler validate apps/desktop/dist/electron/mac-arm64/Nakama.app
          spctl --assess --type execute apps/desktop/dist/electron/mac-arm64/Nakama.app
          NAKAMA_DESKTOP_TEST_RUNTIME="$PWD/apps/desktop/dist/electron/mac-arm64/Nakama.app/Contents/Resources/runtime" bun run --cwd apps/desktop test:runtime

      # Hand-off only: publishing runs in a separate job without signing access.
      - name: Upload signed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nakama-desktop-mac
          path: |
            apps/desktop/dist/electron/*.dmg
            apps/desktop/dist/electron/*.zip
            apps/desktop/dist/electron/*.blockmap
            apps/desktop/dist/electron/latest-mac.yml
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [release, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Download signed build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nakama-desktop-mac
          path: apps/desktop/dist/release/mac
      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nakama-windows-installer
          path: apps/desktop/dist/release/windows
      - name: Publish version and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun apps/desktop/scripts/publish-release.mjs

  windows-installer:
    if: github.event_name == 'push' || inputs.windows_target == 'installer'
    environment: code-signing
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Validate installer version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne "desktop-v$version")) {
            throw 'Release tag must match the stable desktop package version.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER_NAME)) { throw 'Missing WINDOWS_PUBLISHER_NAME.' }
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun apps/desktop/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test desktop and build runtime
        run: |
          bun run --cwd apps/desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd apps/desktop build:runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and package Windows installer
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw 'Missing Windows code-signing credentials.'
          }
          bun x electron-builder --win nsis --x64 --publish never -c.forceCodeSigning=true "-c.win.signtoolOptions.publisherName=$env:WINDOWS_PUBLISHER_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and packaged runtime
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $output = Join-Path $PWD 'apps/desktop/dist/electron'
          if ((Get-Item "$output/win-unpacked/Nakama.exe").VersionInfo.ProductVersion -cne $version) {
            throw 'Packaged application version does not match the release.'
          }
          foreach ($file in @("$output/Nakama-$version-x64-Setup.exe", "$output/win-unpacked/Nakama.exe")) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate -or
                $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -cne $env:WINDOWS_PUBLISHER_NAME) {
              throw "Invalid signature or publisher: $file"
            }
          }
          bun -e 'const c = Bun.YAML.parse(await Bun.file("apps/desktop/dist/electron/win-unpacked/resources/app-update.yml").text()); if (c.provider !== "generic" || c.url !== "https://github.com/ahmadrosid/nakama/releases/download/desktop-updates" || ![c.publisherName].flat().includes(process.env.WINDOWS_PUBLISHER_NAME)) throw new Error("Unexpected updater configuration");'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NAKAMA_DESKTOP_TEST_RUNTIME = Join-Path $output 'win-unpacked/resources/runtime'
          bun run --cwd apps/desktop test:runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nakama-windows-installer
          path: |
            apps/desktop/dist/electron/*-x64-Setup.exe
            apps/desktop/dist/electron/*-x64-Setup.exe.blockmap
            apps/desktop/dist/electron/latest.yml
          compression-level: 0
          if-no-files-found: error

  windows-store:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.windows_target == 'store')) }}
    environment: code-signing
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Validate target release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "desktop-v$version") {
            throw 'Release tag must match the stable desktop package version.'
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # No Store credentials in this job's environment yet, and no lifecycle
      # script runs while installing.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun apps/desktop/node_modules/electron/install.js
      - name: Test desktop
        run: bun run --cwd apps/desktop test
      - name: Build unsigned Store package
        run: bun run --cwd apps/desktop package:store
        env:
          WINDOWS_STORE_IDENTITY_NAME: ${{ secrets.WINDOWS_STORE_IDENTITY_NAME }}
          WINDOWS_STORE_PUBLISHER: ${{ secrets.WINDOWS_STORE_PUBLISHER }}
          WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
          WINDOWS_STORE_DISPLAY_NAME: ${{ secrets.WINDOWS_STORE_DISPLAY_NAME }}
      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $env:NAKAMA_DESKTOP_TEST_RUNTIME = Join-Path $PWD 'apps/desktop/dist/electron/win-unpacked/resources/runtime'
          bun run --cwd apps/desktop test:runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nakama-windows-store
          path: apps/desktop/dist/electron/*.msix
          if-no-files-found: error
