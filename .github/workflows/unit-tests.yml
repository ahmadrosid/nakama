name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Bun 1.4 supports the HTTP agent interception used by plugin registry fixtures.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: |
          bun apps/desktop/node_modules/electron/install.js
          sudo chown root:root apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 apps/desktop/node_modules/electron/dist/chrome-sandbox
          xvfb-run -a bun run test

  # The desktop app ships on Windows, but only Linux gated changes so far.
  # Non-blocking until the remaining Windows-only failures are fixed or skipped.
  test-windows:
    name: test-windows (${{ matrix.shard }}/4)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/platform/*/node_modules
            packages/*/node_modules
            packages/plugins/*/node_modules
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-bun-1.4.0-${{ hashFiles('bun.lock', 'bunfig.toml', '**/package.json', 'patches/**') }}

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      # Save before tests: the non-blocking Windows failures must not discard it.
      - name: Save installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            apps/platform/*/node_modules
            packages/*/node_modules
            packages/plugins/*/node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Run tests
        # Split the slow server suite across runners; run each smaller suite once.
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          bun run --cwd apps/server test --shard="$SHARD/4" --parallel=2 --no-isolate || status=1
          case "$SHARD" in
            1) bun run --cwd packages/core test --parallel=2 --no-isolate || status=1 ;;
            2) bun run --cwd packages/db test --parallel=2 --no-isolate || status=1 ;;
            3) bun run --cwd packages/agent test --parallel=2 --no-isolate || status=1 ;;
          esac
          exit "$status"
