name: Knip

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: knip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Keep the score status; sharing this job avoids a second React Doctor row.
      - name: React Doctor
        uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          commit-status: true

      - name: Set up Bun
        if: github.event_name == 'pull_request'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Run knip
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: bun run knip -- --cache --reporter github-actions
