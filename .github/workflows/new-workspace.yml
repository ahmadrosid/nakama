name: New workspace

# Its own workflow because it is the only check that has to react to a label:
# adding `new-package` must be able to turn it green without a new push, and
# putting that trigger on Quality made duplication and coverage re-run too.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A new push to a PR makes the old run's result useless, so stop it. Main
# keeps every run: each push there is a commit someone may need a result for.
concurrency:
  group: new-workspace-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  new-workspace:
    runs-on: ubuntu-latest
    # AGENTS.md already asks for code to live in an existing package. packages/ui
    # landed anyway, 172 lines and no tests, so the rule needs something that runs.
    # The label is the escape hatch for a package that is genuinely the right call.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'new-package') }}
    steps:
      # Budget: the job fails if its steps take longer, so a slowdown shows up
      # on the PR that causes it. Set from the slowest green run since the
      # shards landed (about 1.3x), and lowered as CI gets faster.
      - name: Start the time budget
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Refuse an unlabelled new workspace
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Any new manifest under these trees is a new workspace: the root
          # package.json globs are apps/*, apps/platform/*, packages/* and
          # packages/plugins/*, and no fixture carries its own package.json.
          added=$(git diff --name-only --diff-filter=A "$BASE...$HEAD" \
            -- 'packages/**/package.json' 'apps/**/package.json')
          if [ -z "$added" ]; then
            echo 'No new workspace.'
            exit 0
          fi
          for f in $added; do
            echo "::error file=$f::new workspace added here"
          done
          cat >&2 <<'MSG'
          This PR adds a workspace. Put the code in an existing package unless one
          genuinely cannot hold it, which is what AGENTS.md asks for.
          If the package is the right call, add the new-package label to this PR.
          MSG
          exit 1

      - name: Check the time budget
        shell: bash
        env:
          BUDGET: 20
        run: |
          took=$(( $(date +%s) - JOB_START ))
          echo "Took ${took}s of a ${BUDGET}s budget."
          (( took <= BUDGET )) || { echo "::error::Over the time budget: ${took}s > ${BUDGET}s. Find what got slower."; exit 1; }
