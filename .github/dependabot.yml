version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "oven/bun"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bun"
    directory: "/docs/website"
    schedule:
      interval: "weekly"

  # Installed into the image by the Dockerfile.
  - package-ecosystem: "bun"
    directory: "/.docker/runtime-deps"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
