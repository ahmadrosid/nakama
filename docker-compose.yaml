services:
  nakama:
    image: ghcr.io/ahmadrosid/nakama:latest
    ports:
      - "4310:4310"
    environment:
      - NAKAMA_CONFIG_DIR=/nakama/data
      # Optional: skip the browser setup wizard on first boot.
      # All three must be set together or none at all.
      # - NAKAMA_SEED_ADMIN_EMAIL=admin@example.com
      # - NAKAMA_SEED_ADMIN_NAME=Admin
      # - NAKAMA_SEED_ADMIN_PASSWORD=changeme123
      # Optional: public URL for OAuth callbacks and shared links.
      # Set this when running behind a reverse proxy.
      # - NAKAMA_WEB_PUBLIC_URL=https://nakama.example.com
    volumes:
      - nakama-data:/nakama/data
    restart: unless-stopped

volumes:
  nakama-data:
