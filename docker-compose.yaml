services:
  nakama:
    # Set NAKAMA_VERSION (e.g. 0.4.57) to pin a release; a rollback is the previous number.
    image: ghcr.io/ahmadrosid/nakama:${NAKAMA_VERSION:-latest}
    ports:
      - "4310:4310"
    env_file:
      - nakama-secrets.env
    environment:
      - NAKAMA_CONFIG_DIR=/nakama/data
      # Daily encrypted export, newest 7 kept. Must stay outside the data volume.
      - NAKAMA_BACKUP_DIR=/nakama/backups
      # Where the Update button leaves requests for the updater service below.
      - NAKAMA_UPDATER_DIR=/nakama/updates
      # Optional: skip the browser setup wizard on first boot.
      # All three must be set together or none at all.
      # - NAKAMA_SEED_ADMIN_EMAIL=admin@example.com
      # - NAKAMA_SEED_ADMIN_NAME=Admin
      # - NAKAMA_SEED_ADMIN_PASSWORD=changeme123
      # Optional: public URL for OAuth callbacks and shared links.
      # Set this when running behind a reverse proxy.
      # - NAKAMA_WEB_PUBLIC_URL=https://nakama.example.com
    volumes:
      - nakama-data:/nakama/data
      - nakama-backups:/nakama/backups
      - nakama-updates:/nakama/updates
    restart: unless-stopped

  # Optional: the Update button in Settings. Turn it on with
  # COMPOSE_PROFILES=updater in .env. It holds the Docker socket, which is root
  # on this host, so it opens no port and only upgrades the nakama service.
  updater:
    image: docker:29-cli
    profiles: ["updater"]
    environment:
      # The docker:cli image defaults to tcp://docker:2375.
      - DOCKER_HOST=unix:///var/run/docker.sock
      - NAKAMA_IMAGE=ghcr.io/ahmadrosid/nakama:${NAKAMA_VERSION:-latest}
    # The script ships inside the Nakama image, so it updates with Nakama.
    entrypoint:
      - sh
      - -c
      - docker run --rm --entrypoint cat "$$NAKAMA_IMAGE" /app/scripts/nakama-updater.sh > /tmp/updater.sh && exec sh /tmp/updater.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose
      - nakama-updates:/updates
    restart: unless-stopped

volumes:
  nakama-data:
  nakama-backups:
  nakama-updates:
