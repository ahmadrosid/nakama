<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="light dark" name="color-scheme">
    <title>Nakama Meet</title>
    <style>
    /* Match Nakama's themes in apps/web/src/index.css. */
    :root {
      --background: #fafafa;
      --foreground: #171717;
      --card: #ffffff;
      --primary: #b45309;
      --primary-hover: #92400e;
      --primary-foreground: #ffffff;
      --muted: #636363;
      --border: #e5e5e5;
      --hover: #f4f4f5;
      --success: #15803d;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0a0b;
        --foreground: #fafafa;
        --card: #18181b;
        --primary: #f59e0b;
        --primary-hover: #fbbf24;
        --primary-foreground: #0a0a0b;
        --muted: #a1a1aa;
        --border: #27272a;
        --hover: #27272a;
        --success: #4ade80;
        --success-bg: #14532d33;
        --success-border: #166534;
        color-scheme: dark;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      font:
        14px / 1.5 Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--foreground);
      background: var(--background);
    }
    header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    header svg {
      flex-shrink: 0;
      color: var(--foreground);
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }
    main {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .actions {
      display: grid;
      gap: 8px;
      padding: 16px;
    }
    .summary {
      padding: 16px 16px 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
    }
    #connection {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    #connection[data-connected="true"] {
      color: var(--success);
    }
    ol {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    li {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .step {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--border);
      border-radius: 50%;
    }
    .step[data-done="true"] {
      color: var(--success);
      background: var(--success-bg);
      border-color: var(--success-border);
    }
    button {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 500;
      color: var(--foreground);
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition:
        background-color 120ms ease,
        opacity 120ms ease;
    }
    [hidden] {
      display: none !important;
    }
    form {
      display: grid;
      gap: 8px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
    }
    input {
      min-height: 40px;
      padding: 9px 12px;
      font: inherit;
      color: var(--foreground);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }
    #pair-code {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.1em;
    }
    button:hover:not(:disabled) {
      background: var(--hover);
    }
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    #start,
    #connect {
      color: var(--primary-foreground);
      background: var(--primary);
      border-color: transparent;
    }
    #start:hover:not(:disabled),
    #connect:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    #status {
      min-height: 66px;
      padding: 12px 16px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      text-wrap: pretty;
      overflow-wrap: anywhere;
      border-top: 1px solid var(--border);
    }
    #transcript {
      max-height: 300px;
      padding: 0 16px;
      overflow-y: auto;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    #transcript p {
      margin: 12px 0;
    }
    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }
    </style>
  </head>
  <body>
    <header>
      <!-- Nakama mark, same as apps/web/public/nakama-mark.svg. -->
      <svg
        aria-hidden="true"
        fill="none"
        height="20"
        viewBox="0 0 48 48"
        width="20"
      >
        <path
          d="M24 10.58L8.5 37.42L39.5 37.42Z"
          stroke="currentColor"
          stroke-linejoin="round"
          stroke-width="4.2"
        />
        <circle cx="24" cy="10.58" fill="currentColor" r="7.5" />
        <circle cx="8.5" cy="37.42" fill="currentColor" r="7.5" />
        <circle cx="39.5" cy="37.42" fill="currentColor" r="7.5" />
      </svg>
      <h1>Nakama Meet</h1>
      <span id="connection">Checking…</span>
    </header>
    <main>
      <div class="summary">
        <h2 id="meeting">Getting ready</h2>
        <ol aria-label="Transcription setup">
          <li>
            <span aria-hidden="true" class="step" id="connect-step">1</span
            ><span id="connect-label">Connect Nakama</span>
          </li>
          <li>
            <span aria-hidden="true" class="step" id="meet-step">2</span
            ><span id="meet-label">Open Google Meet</span>
          </li>
        </ol>
      </div>
      <div class="actions">
        <form hidden id="connect-form">
          <label for="origin">Nakama address</label>
          <input
            autocomplete="url"
            id="origin"
            placeholder="https://nakama.example.com"
            required
            spellcheck="false"
            type="text"
          >
          <button id="connect" type="submit">Connect</button>
        </form>
        <p hidden id="pair-code"></p>
        <button id="open-side-panel" type="button">Open side panel</button>
        <button hidden id="start" type="button">Start transcription</button>
        <button hidden id="stop" type="button">Stop transcription</button>
        <button hidden id="disconnect" type="button">Disconnect</button>
      </div>
      <button hidden id="full-transcript" type="button">
        Open full transcript
      </button>
      <section aria-label="Live transcript" id="transcript"></section>
      <div aria-live="polite" id="status" role="status">
        Checking connection…
      </div>
    </main>
    <script defer src="popup.js"></script>
  </body>
</html>
