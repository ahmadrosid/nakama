<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Workflows</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <main>
      <header>
        <h1>Workflows</h1>
        <button id="new" type="button">New workflow</button>
      </header>
      <p hidden id="error" role="alert"></p>
      <div class="layout">
        <nav aria-label="Workflows" id="list">Loading…</nav>
        <section>
          <form hidden id="editor">
            <div class="fields">
              <label>Name<input id="name" maxlength="200" required></label
              ><label>Agent<select id="agent" required></select></label>
            </div>
            <label>Description<input id="description"></label
            ><label class="check"
              ><input checked id="enabled" type="checkbox">Enabled</label
            >
            <div id="steps"></div>
            <button id="add" type="button">Add step</button>
            <label
              >Summary instructions<textarea
                id="summary"
                required
                rows="3"
              >Summarize only the step results.</textarea></label
            >
            <div class="buttons">
              <button type="submit">Save</button
              ><button id="run" type="button">Run</button
              ><button id="delete" type="button">Delete</button>
            </div>
            <label>Run input<textarea id="input" rows="2">{}</textarea></label>
          </form>
          <p id="empty">Create a workflow to get started.</p>
          <section aria-label="Run history" id="history"></section>
        </section>
      </div>
      <details id="database-panel">
        <summary>Workflow data</summary>
        <label
          >Table<select id="table">
            <option value="">Select a table</option>
          </select></label
        >
        <div id="database"></div>
      </details>
      <dialog id="confirm">
        <form method="dialog">
          <h2>Delete workflow?</h2>
          <p>This removes the recipe and its run history.</p>
          <div class="buttons">
            <button type="submit" value="cancel">Cancel</button
            ><button type="submit" value="delete">Delete</button>
          </div>
        </form>
      </dialog>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
